spring:
  application:
    name: GATEWAY-service

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: servicio1
              uri: lb://ProjService
              predicates:
                - Path=/say/saludo/**
            - id: servicio2
              uri: lb://REST-EMPLOYEE
              predicates:
                - Path=/api/employee/**
            - id: servicio3
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/usuario/**
